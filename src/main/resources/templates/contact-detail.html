<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>問い合わせ詳細 | 問い合わせ管理システム</title>
  <link rel="stylesheet" th:href="@{/css/style.css}">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0">
</head>
<body>
  <div class="container">
    <header class="header">
      <div class="header-content">
        <div>
          <h1>問い合わせ詳細</h1>
        </div> 
      </div>
    </header>

    <main>
      <div id="contact-detail" class="card">
        <div class="card-header">
          <div class="card-header-content">
            <div>
              <h2 id="contact-subject">件名がここに表示されます</h2>
            </div>
            <div class="contact-id-container">
              <div class="text-muted">問い合わせID</div>
              <div id="contact-id" class="contact-id">ID</div>
            </div>
          </div>
        </div>
        
        <div class="card-content">
          <div class="contact-info-grid">
            <div class="contact-info-item">
              <h3 class="text-muted">お名前</h3>
              <p id="contact-name">名前</p>
            </div>
            <div class="contact-info-item">
              <h3 class="text-muted">メールアドレス</h3>
              <p id="contact-email">メール</p>
            </div>
            <div class="contact-info-item">
              <h3 class="text-muted">電話番号</h3>
              <p id="contact-phone">電話番号</p>
            </div>
            <div class="contact-info-item">
              <h3 class="text-muted">作成日</h3>
              <p id="contact-created"></p>
            </div>
          </div>

          <div class="message-container">
            <h3 class="text-muted">メッセージ</h3>
            <div id="contact-message" class="message-box">メッセージ</div>
          </div>

          <div class="detail-actions">
            <div id="contact-updated" class="text-muted">最終更新: 2023/05/01</div>
          </div>
        </div>
        <div class="card-footer">
            <a href="/" class="btn btn-outline no-underline">
              <span class="material-symbols-outlined">arrow_back</span>
              <span>戻る</span>
            </a>
            <a href="/" id="edit-contact-btn" class="btn btn-primary no-underline">
              <span class="material-symbols-outlined">edit</span>
              <span>編集</span>
            </a>
        </div>
      </div>
    </main>
  </div>
  <script th:src="@{/js/common.js}"></script>
</body>
</html>
