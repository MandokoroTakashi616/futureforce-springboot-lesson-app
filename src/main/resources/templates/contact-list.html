<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>問い合わせ管理システム</title>
  <link rel="stylesheet" th:href="@{/css/style.css}">
  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0">
</head>

<body>
  <div class="container">
    <header class="header">
      <div class="header-content">
        <div>
          <h1>問い合わせ管理</h1>
          <p class="text-muted">お客様からの問い合わせを管理します</p>
        </div>
        <a class="btn btn-primary no-underline" href="/">新規作成</a>
      </div>
    </header>

    <main>
      <div id="empty-state" class="empty-state">
        <h3>問い合わせがありません</h3>
        <p class="text-muted">新しい問い合わせを作成してください</p>
        <a class="btn btn-primary no-underline" href="/">新規作成</a>
      </div>

      <!-- 問い合わせがある場合 -->
      <div id="contacts-table-container" class="table-container">
        <table id="contacts-table" class="table">
          <thead>
            <tr>
              <th>ID</th>
              <th>名前</th>
              <th>メール</th>
              <th>件名</th>
              <th>作成日</th>
              <th class="text-right">アクション</th>
            </tr>
          </thead>
          <tbody id="contacts-body">
            <tr>
              <td>1</td>
              <td>名前</td>
              <td>example@mail.com</td>
              <td>件名</td>
              <td>2024-01-01</td>
              <td class="text-right">
                <div class="action-buttons">
                  <a class="action-button view" title="詳細" href="/">
                    <span class="material-symbols-outlined">visibility</span>
                  </a>
                  <a class="action-button edit" title="編集" href="/">
                    <span class="material-symbols-outlined">edit</span>
                  </a>
                  <a class="action-button delete" title="削除" href="/">
                    <span class="material-symbols-outlined">delete</span>
                  </a>
                </div>
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </main>

    <!-- 削除確認モーダル -->
    <div id="delete-modal" class="modal">
      <div class="modal-content">
        <div class="modal-header">
          <h2>この問い合わせを削除しますか？</h2>
          <p class="text-muted">この操作は元に戻せません。削除すると、この問い合わせのデータは完全に消去されます。</p>
        </div>
        <div class="modal-footer">
          <button id="cancel-delete" class="btn btn-outline">キャンセル</button>
          <button id="confirm-delete" class="btn btn-danger">OK</button>
        </div>
      </div>
    </div>
    <div id="modal-overlay" class="modal-overlay"></div>
  </div>

  <script th:src="@{/js/common.js}"></script>
</body>

</html>
